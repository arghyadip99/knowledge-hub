server {
  listen 80;

  # Vite's hashed asset filenames change whenever their content does, so these
  # are safe to cache indefinitely — a rebuild simply produces a new filename.
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html is the one file whose *name* never changes across rebuilds, so
  # it must never be cached — otherwise a browser can keep serving a stale
  # shell that still points at yesterday's (now-deleted) asset hashes.
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://api:4000; }
}
